# À chaque envoi sur main : types, lint, tests unitaires et de contenu, construction du site,
# tests de bout en bout et d'accessibilité, puis publication sur GitHub Pages (branche gh-pages).
name: Vérifier et publier

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication
  cancel-in-progress: true

jobs:
  verifier-et-publier:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BASE_PATH: /meridien
      NEXT_PUBLIC_SITE_URL: https://patrick-dke.github.io
      # Configuration publique de l'application web Firebase (variables du dépôt) : vides tant que les comptes
      # ne sont pas ouverts ; le site affiche alors « comptes bientôt disponibles ».
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run build --prefix functions
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Règles d'accès Firestore, éprouvées dans l'émulateur (Java requis).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npx --yes firebase-tools@15.23.0 emulators:exec --only firestore --project demo-meridien "npx vitest run -c vitest.regles.config.mts"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-playwright
          path: test-results/
          retention-days: 7
      - name: Publier sur GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          commit_message: "Publication du site"
